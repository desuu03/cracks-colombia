# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  #Conexión ARM para la gestion de app service
  azureARMConnection: 'azure-connection'
  #Conexión docker registry para autenticar con ACR
  dockerRegistryConnection: 'docker-registry-connection'
  #Servidor del registro de contenedores ACR
  containerRegistry: 'acrapicrackscolombia.azurecr.io'
  #Nombre del repositorio dentro de ACR
  imageRepository: 'api-crackscolombia'
  #Nombre de la Azure App Service
  webAppName: 'api-crackscolombia-prod'
  #Etiqueta de la imagen docker basada en el id de compilación
  tag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Compilar e impulsar imagen docker a ACR'
    jobs:
      - job: Build
        displayName: 'Build and push job'
        steps:
           #Tarea para construir y subir la imagen docker usando la conexión docker registry

          - task: Docker@2
            displayName: 'Construir y subir la imagen a ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: '$(Build.SourceDirectory)/Dockerfile'
              containerRegistry: $(dockerRegistryConnection)
              tags: |
                $(tag)
                latest
  - stage: Deploy
    displayName: 'Desplegar a azure app service'
    dependsOn: BuildAndPush
    jobs:
      - job: Deploy
        displayName: 'Deploy Job'
        steps:
          #Tarea para desplegar el contenedor usando la conexión de azure resource manager
          - task: AzureWebAppContainer@1
            displayName: 'Desplegar contenedor en azure app service'
            inputs:
              azureSubscription: $(azureARMConnection)
              appName: $(webAppName)
              containers: '$(containerRegistry)/$(imageRepository):$(tag)'

