services:
  postgres:
    image: postgres:16-alpine
    container_name: cracks-colombia-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cracks_colombia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - cracks_colombia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cracks_colombia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cracks_colombia_pgdata:
