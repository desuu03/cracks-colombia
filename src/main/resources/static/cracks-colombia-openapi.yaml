openapi: 3.0.3
info:
  title: Cracks Colombia API
  description: >
    API de la plataforma Cracks Colombia, que conecta deportistas jóvenes
    con ojeadores/entrenadores y clubes deportivos. Cubre los tres procesos
    de negocio: Gestión de perfiles, Búsqueda y evaluación de talento, y
    Gestión de solicitudes de contacto (Match).
  version: "1.0.0"
  contact:
    name: Santiago Andrés Navarro Ortiz
    email: sano2003@hotmail.es

servers:
  - url: https://api.crackscolombia.co/v1
    description: Producción
  - url: https://staging-api.crackscolombia.co/v1
    description: Staging

tags:
  - name: Auth
    description: Registro e inicio de sesión (HU-01)
  - name: Users
    description: Gestión de perfiles de usuario (HU-02)
  - name: Videos
    description: Carga y gestión de videos de habilidades (HU-03)
  - name: Moderation
    description: Moderación de contenido (HU-09)
  - name: Search
    description: Búsqueda y filtrado de talento (HU-04, HU-10)
  - name: MatchRequests
    description: Solicitudes de contacto / prueba (HU-05)
  - name: Notifications
    description: Notificaciones automáticas (HU-06)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un nuevo usuario (Deportista u Ojeador/Entrenador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Datos inválidos o consentimiento de acudiente faltante (menores de edad)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me:
    get:
      tags: [Users]
      summary: Obtener el perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: No autenticado
    put:
      tags: [Users]
      summary: Editar el perfil del usuario autenticado (deportista u ojeador)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "422":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /athletes/{athleteId}:
    get:
      tags: [Users]
      summary: Obtener el perfil público de un deportista
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Perfil público del deportista (solo contenido aprobado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthletePublicProfile"
        "404":
          description: Deportista no encontrado

  /athletes/{athleteId}/videos:
    get:
      tags: [Videos]
      summary: Listar los videos aprobados de un deportista
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "200":
          description: Lista de videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      tags: [Videos]
      summary: Cargar un video de habilidades (propietario del perfil)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo de video (máx. ~50 MB, ~60 s) o URL embebida
                videoUrl:
                  type: string
                  format: uri
                  description: Alternativa a file; enlace embebido (p. ej. YouTube)
      responses:
        "201":
          description: Video cargado y puesto en estado pendiente de moderación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Formato, tamaño o duración no válidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No es el propietario del perfil

  /videos/{videoId}:
    delete:
      tags: [Videos]
      summary: Eliminar un video propio
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "204":
          description: Video eliminado
        "403":
          description: No es el propietario del video
        "404":
          description: Video no encontrado

  /moderation/queue:
    get:
      tags: [Moderation]
      summary: Listar contenido pendiente de moderación (rol Moderador)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Página de contenido pendiente, ordenado por fecha de carga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationQueuePage"
        "403":
          description: Rol sin permiso de moderación

  /moderation/{videoId}/approve:
    post:
      tags: [Moderation]
      summary: Aprobar un video o dato pendiente
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Contenido aprobado y publicado
        "403":
          description: Rol sin permiso de moderación
        "404":
          description: Contenido no encontrado

  /moderation/{videoId}/reject:
    post:
      tags: [Moderation]
      summary: Rechazar un video o dato pendiente, devolviéndolo al deportista
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Contenido no relacionado con la disciplina declarada"
      responses:
        "200":
          description: Contenido rechazado con motivo registrado
        "403":
          description: Rol sin permiso de moderación
        "404":
          description: Contenido no encontrado

  /athletes/search:
    get:
      tags: [Search]
      summary: Buscar y filtrar deportistas (solo perfiles aprobados)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sport
          in: query
          schema: { type: string }
          example: fútbol
        - name: position
          in: query
          schema: { type: string }
          example: delantero
        - name: minAge
          in: query
          schema: { type: integer }
        - name: maxAge
          in: query
          schema: { type: integer }
        - name: region
          in: query
          schema: { type: string }
          example: Quindío
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Página de resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteSearchPage"

  /athletes/{athleteId}/interest:
    post:
      tags: [Search]
      summary: Marcar a un deportista como prospecto de interés (ojeador/entrenador)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AthleteId"
      responses:
        "201":
          description: Marca de interés registrada; habilita crear una solicitud de Match
        "403":
          description: Solo disponible para el rol Ojeador/Entrenador

  /requests:
    get:
      tags: [MatchRequests]
      summary: Listar las solicitudes de contacto del usuario autenticado (enviadas o recibidas)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchRequest"
    post:
      tags: [MatchRequests]
      summary: Crear una solicitud de contacto/prueba (Match) a un deportista
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequestCreate"
      responses:
        "201":
          description: Solicitud creada en estado Pendiente; se notifica al deportista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequest"
        "403":
          description: Solo disponible para el rol Ojeador/Entrenador
        "409":
          description: Ya existe una solicitud pendiente para este deportista

  /requests/{requestId}/respond:
    patch:
      tags: [MatchRequests]
      summary: Aceptar o rechazar una solicitud de contacto (deportista)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [ACCEPTED, REJECTED]
      responses:
        "200":
          description: >
            Solicitud actualizada. Si se acepta, se habilita el intercambio
            de datos de contacto y se notifica al club/entrenador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequest"
        "403":
          description: No es el destinatario de la solicitud
        "404":
          description: Solicitud no encontrada

  /notifications:
    get:
      tags: [Notifications]
      summary: Listar notificaciones del usuario autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Marcar una notificación como leída
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notificación marcada como leída
        "404":
          description: Notificación no encontrada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AthleteId:
      name: athleteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Role:
      type: string
      enum: [DEPORTISTA, OJEADOR_ENTRENADOR, MODERADOR, ADMIN]

    RegisterRequest:
      type: object
      required: [email, password, role, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        isMinor:
          type: boolean
          description: Indica si el deportista es menor de edad
        guardianConsent:
          type: object
          description: Requerido cuando isMinor = true
          properties:
            guardianFullName: { type: string }
            guardianEmail: { type: string, format: email }
            accepted: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        # Campos de deportista (si role = DEPORTISTA)
        sport: { type: string }
        position: { type: string }
        region: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        trajectory: { type: string }
        # Campos de ojeador/entrenador (si role = OJEADOR_ENTRENADOR)
        club: { type: string }
        contactPhone: { type: string }

    UserProfileUpdate:
      type: object
      description: Mismos campos de UserProfile, todos opcionales en la actualización
      properties:
        sport: { type: string }
        position: { type: string }
        region: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        trajectory: { type: string }
        club: { type: string }
        contactPhone: { type: string }

    AthletePublicProfile:
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          properties:
            videos:
              type: array
              items:
                $ref: "#/components/schemas/Video"

    Video:
      type: object
      properties:
        id: { type: string, format: uuid }
        athleteId: { type: string, format: uuid }
        url: { type: string, format: uri }
        durationSeconds: { type: integer }
        status:
          type: string
          enum: [PENDIENTE, APROBADO, RECHAZADO]
        rejectionReason: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time }

    ModerationQueuePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        page: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer }

    AthleteSearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AthletePublicProfile"
        page: { type: integer }
        totalPages: { type: integer }
        totalElements: { type: integer }

    RequestStatus:
      type: string
      enum: [PENDIENTE, ACEPTADA, RECHAZADA]

    MatchRequestCreate:
      type: object
      required: [athleteId, message]
      properties:
        athleteId: { type: string, format: uuid }
        message: { type: string }
        proposedDate: { type: string, format: date-time, nullable: true }

    MatchRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        athleteId: { type: string, format: uuid }
        scoutId: { type: string, format: uuid }
        message: { type: string }
        proposedDate: { type: string, format: date-time, nullable: true }
        status:
          $ref: "#/components/schemas/RequestStatus"
        contactSharedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [PROFILE_VIEWED, REQUEST_CREATED, REQUEST_ACCEPTED, REQUEST_REJECTED]
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
