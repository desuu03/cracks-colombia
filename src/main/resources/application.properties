spring.application.name=cracks-colombia-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cracks_colombia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
