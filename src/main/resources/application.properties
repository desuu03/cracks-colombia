spring.application.name=cracks-colombia-api
spring.datasource.url=${DB_URL:jdbc:postgresql://host.docker.internal:5432/cracks_colombia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.servlet.multipart.max-file-size=${VIDEO_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${VIDEO_MAX_REQUEST_SIZE:51MB}
app.video.storage-dir=${VIDEO_STORAGE_DIR:./data/videos}
app.video.max-file-size-bytes=${VIDEO_MAX_FILE_SIZE_BYTES:50000000}
app.video.max-duration-seconds=${VIDEO_MAX_DURATION_SECONDS:60}

app.photo.storage-dir=${PHOTO_STORAGE_DIR:./data/photos}
app.photo.max-file-size-bytes=${PHOTO_MAX_FILE_SIZE_BYTES:5000000}
